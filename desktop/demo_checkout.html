<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Express Checkout & Billing Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 580px;
            background: #131b2e;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #00e5ff;
            font-size: 22px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            background: #070b14;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #00e5ff;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
        }
        .row {
            display: flex;
            gap: 14px;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #00e5ff, #3b82f6);
            color: #000;
            font-weight: 700;
            font-size: 15px;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 14px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Express Checkout (Chromium Autofill Demo)</h2>
        <form onsubmit="event.preventDefault(); alert('Order Placed Successfully via Antigravity Autofill!');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" id="fullName" placeholder="e.g. Alex Mercer" autocomplete="name" required />
            </div>
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label>Email Address</label>
                    <input type="email" name="email" id="email" placeholder="alex@company.com" autocomplete="email" required />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" id="phone" placeholder="+1 (415) 890-1234" autocomplete="tel" />
                </div>
            </div>
            <div class="form-group">
                <label>Street Address</label>
                <input type="text" name="address" id="address" placeholder="555 Market Street, Suite 400" autocomplete="street-address" />
            </div>
            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label>City</label>
                    <input type="text" name="city" id="city" placeholder="San Francisco" autocomplete="address-level2" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>State</label>
                    <input type="text" name="state" id="state" placeholder="CA" autocomplete="address-level1" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ZIP Code</label>
                    <input type="text" name="zip" id="zip" placeholder="94105" autocomplete="postal-code" />
                </div>
            </div>
            <div class="form-group">
                <label>Credit Card Number</label>
                <input type="text" name="card" id="card" placeholder="4242 4242 4242 4242" autocomplete="cc-number" />
            </div>
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label>Expiry (MM/YY)</label>
                    <input type="text" name="expiry" id="expiry" placeholder="12/28" autocomplete="cc-exp" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>CVV / CVC</label>
                    <input type="password" name="cvv" id="cvv" placeholder="789" autocomplete="cc-csc" maxlength="4" />
                </div>
            </div>
            <button type="submit" class="btn-submit" id="btnPlaceOrder">Complete Purchase ($99.00)</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Express Checkout & Billing Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #060911;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            background: radial-gradient(circle at 50% 0%, rgba(14, 28, 58, 0.5) 0%, transparent 60%), #060911;
        }
        .card {
            width: 100%;
            max-width: 580px;
            background: rgba(13, 20, 36, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.08);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }
        h2 .accent {
            color: #00f0ff;
        }
        .badge-demo {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 240, 255, 0.12);
            color: #00f0ff;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            margin-left: auto;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(6, 10, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        input:focus {
            outline: none;
            border-color: #00f0ff;
            background: rgba(8, 14, 28, 0.98);
            box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.25), 0 0 16px rgba(0, 240, 255, 0.15);
        }
        .row {
            display: flex;
            gap: 14px;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff, #818cf8);
            color: #050811;
            font-weight: 700;
            font-size: 14px;
            border: none;
            padding: 14px;
            border-radius: 9px;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: -0.2px;
        }
        .btn-submit:hover {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Express Checkout (Chromium Autofill Demo)</h2>
        <form onsubmit="event.preventDefault(); alert('Order Placed Successfully via BATTLENX Autofill!');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" id="fullName" placeholder="e.g. Alex Mercer" autocomplete="name" required />
            </div>
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label>Email Address</label>
                    <input type="email" name="email" id="email" placeholder="alex@company.com" autocomplete="email" required />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" id="phone" placeholder="+1 (415) 890-1234" autocomplete="tel" />
                </div>
            </div>
            <div class="form-group">
                <label>Street Address</label>
                <input type="text" name="address" id="address" placeholder="555 Market Street, Suite 400" autocomplete="street-address" />
            </div>
            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label>City</label>
                    <input type="text" name="city" id="city" placeholder="San Francisco" autocomplete="address-level2" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>State</label>
                    <input type="text" name="state" id="state" placeholder="CA" autocomplete="address-level1" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ZIP Code</label>
                    <input type="text" name="zip" id="zip" placeholder="94105" autocomplete="postal-code" />
                </div>
            </div>
            <div class="form-group">
                <label>Credit Card Number</label>
                <input type="text" name="card" id="card" placeholder="4242 4242 4242 4242" autocomplete="cc-number" />
            </div>
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label>Expiry (MM/YY)</label>
                    <input type="text" name="expiry" id="expiry" placeholder="12/28" autocomplete="cc-exp" />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>CVV / CVC</label>
                    <input type="password" name="cvv" id="cvv" placeholder="789" autocomplete="cc-csc" maxlength="4" />
                </div>
            </div>
            <button type="submit" class="btn-submit" id="btnPlaceOrder">Complete Purchase ($99.00)</button>
        </form>
    </div>
</body>
</html>
